<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <button id="sidebar-scrim" class="sidebar-scrim" aria-label="Close sidebar" hidden></button>
  <aside class="rail" id="sidebar" aria-label="Workspace sidebar">
    <div class="rail-brand"><a class="brand" href="#tasks" aria-label="Moyai home"><img src="/static/favicon.svg?v=moyai-train-1" alt="" width="27" height="27"><span class="brand-copy"><span>Moyai</span><small id="workspace-name">Workspace</small></span></a><div class="rail-tools"><button id="search-sessions" class="icon-button" data-icon="search" data-icon-size="18" aria-label="Search sessions" title="Search sessions"></button><button id="close-sidebar" class="icon-button" data-icon="sidebar" data-icon-size="18" aria-label="Close sidebar" title="Hide sidebar"></button></div></div>
    <button class="new-task" id="new-task"><span class="nav-icon" data-icon="plus" data-icon-size="17"></span>New session<kbd>⌘K</kbd></button>

    <nav class="workspace-nav rail-links" aria-label="Workspace"><button class="nav-button" data-view="automations"><span class="nav-icon" data-icon="clock" data-icon-size="17"></span>Automations</button><button class="nav-button" data-view="skills"><span class="nav-icon" data-icon="book" data-icon-size="17"></span>Skills</button><button class="nav-button" data-view="connections"><span class="nav-icon" data-icon="grid" data-icon-size="17"></span>Connections</button></nav>
    <div class="sessions-label"><select id="session-scope" aria-label="Filter sessions" disabled><option value="mine">My sessions</option></select><span id="task-count">0</span><button id="new-folder" class="folder-add" type="button" title="Create a folder to organize sessions" aria-haspopup="dialog" aria-controls="session-folder-dialog"><span data-icon="folder-plus" data-icon-size="16"></span>Add folder</button></div>
    <label class="session-search" id="session-search-field" hidden><span class="nav-icon" data-icon="search" data-icon-size="16"></span><input id="session-search" type="search" placeholder="Search titles and messages…" aria-label="Search sessions" maxlength="200" autocomplete="off"></label>
    <nav id="session-list" class="session-list" aria-label="Recent sessions"></nav>
    <nav id="settings-navigation" aria-label="Settings" hidden></nav>
    <div class="rail-foot"><small class="rail-identity">Private workspace</small><div class="rail-account-actions"><button class="nav-button rail-settings" data-view="settings" aria-label="Settings" title="Settings"><span class="nav-icon" data-icon="gear" data-icon-size="16"></span></button><button id="logout" class="quiet rail-logout" type="button" aria-label="Sign out" title="Sign out" hidden><span data-icon="logout" data-icon-size="16"></span></button></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><button id="open-sidebar" class="icon-button" aria-label="Open sidebar" aria-expanded="false" aria-controls="sidebar" data-icon="sidebar" data-icon-size="18" title="Show sidebar"></button><span id="page-title">New session</span><div id="header-actions" class="header-right"><span class="environment">Your team's agent</span></div></header>
    <main id="content" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="connection-dialog" aria-labelledby="connection-title"><form id="connection-form"><button class="dialog-close" type="button" aria-label="Close">×</button><h2 id="connection-title">Connect an app</h2><div id="connection-body"></div></form></dialog>
  <dialog id="credential-dialog" aria-labelledby="credential-dialog-title"><form id="credential-form" autocomplete="off"></form></dialog>
  <dialog id="skill-dialog" aria-label="Skill editor"></dialog>
  <dialog id="memory-dialog" aria-label="Memory editor"></dialog>
  <dialog id="user-role-dialog" aria-label="Workspace role"></dialog>
  <dialog id="automation-dialog" aria-label="Automation editor"></dialog>
  <dialog id="session-delete-dialog" aria-labelledby="session-delete-title"></dialog>
  <dialog id="session-folder-dialog" aria-labelledby="session-folder-title"></dialog>
  <div id="session-actions" popover="auto" role="group" aria-label="Session actions"></div>
</body>
</html>
