name: Frontend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: test -z "$(git ls-files -- native/src/moyai/static)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
