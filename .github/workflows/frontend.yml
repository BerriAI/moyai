name: Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'app/static/**'
      - 'tests/**.cjs'
      - 'tests/browser/**'
      - 'tests/helpers/**'
      - 'scripts/settings_ui_preview.cjs'
      - 'scripts/session_ui_demo.py'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vite.app.config.ts'
      - 'openapi-ts.config.ts'
      - 'scripts/export_frontend_schema.py'
      - 'scripts/generate_routes.mjs'
      - 'app/**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'components.json'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths: ['frontend/**', 'app/**', 'package*.json', 'scripts/export_frontend_schema.py', 'scripts/generate_routes.mjs', 'vite*.ts', 'openapi-ts.config.ts', 'pyproject.toml', 'uv.lock']

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13 --no-dev
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Verify startup and session behavior against real local APIs
        run: |
          uv run --frozen --python 3.13 python scripts/session_ui_demo.py --port 8830 > /tmp/moyai-session-ui.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:8830/demo/login >/dev/null; then break; fi
            sleep 1
          done
          SESSION_UI_URL=http://127.0.0.1:8830 node --test tests/browser/session_ui.cjs
