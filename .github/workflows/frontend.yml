name: Frontend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- native/src/moyai/static
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
