name: Docker installation release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'BerriAI/moyai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: moyai-release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Resolve the released source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve the verified main image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: python3 scripts/verify_release_image.py --revision "$REVISION" --check-release-tag
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the complete verified image index without rebuilding
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/berriai/moyai:sha-$REVISION" \
            "ghcr.io/berriai/moyai@$IMAGE_DIGEST"
      - name: Verify the promoted image is identical and publicly readable
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: python3 scripts/verify_release_image.py --revision "$REVISION" --verify-promoted-digest "$IMAGE_DIGEST"
      - name: Build the installation bundle
        env:
          IMAGE: ghcr.io/berriai/moyai@${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: python3 scripts/build_docker_bundle.py --image "$IMAGE" --revision "$REVISION" --output release/moyai-docker.tar.gz
      - name: Attach the bundle to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/moyai-docker.tar.gz

      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Package the matching Helm chart
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: python3 scripts/build_helm_bundle.py --digest "$IMAGE_DIGEST" --revision "$REVISION" --output release/helm
      - name: Publish the chart and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push release/helm/moyai-*.tgz oci://ghcr.io/berriai/charts
          gh release upload "$RELEASE_TAG" release/helm/moyai-*.tgz
