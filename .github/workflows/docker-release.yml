name: Docker installation release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'BerriAI/moyai'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Resolve the released source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/berriai/moyai:sha-${{ steps.revision.outputs.sha }}
          build-args: MOYAI_BUILD_SHA=${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=moyai-release
          cache-to: type=gha,mode=max,scope=moyai-release
          provenance: mode=max
          sbom: true
      - name: Build the installation bundle
        env:
          IMAGE: ghcr.io/berriai/moyai@${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: python3 scripts/build_docker_bundle.py --image "$IMAGE" --revision "$REVISION" --output release/moyai-docker.tar.gz
      - name: Attach the bundle to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/moyai-docker.tar.gz

      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Package the matching Helm chart
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: python3 scripts/build_helm_bundle.py --digest "$IMAGE_DIGEST" --revision "$REVISION" --output release/helm
      - name: Publish the chart and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push release/helm/moyai-*.tgz oci://ghcr.io/berriai/charts
          gh release upload "$RELEASE_TAG" release/helm/moyai-*.tgz
