name: Native Pydantic runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    # The full suite alone took 11m18s in qualification; allow cold install,
    # typecheck and sdist/wheel builds on a smaller shared runner.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: native-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES: postgresql://postgres:native-test-only@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest -q --tb=short
      - run: uv build
