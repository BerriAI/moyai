name: PostgreSQL runtime
on:
  pull_request:
    paths: ['app/**', 'tests/**', 'scripts/postgres_runtime_smoke.py', 'scripts/shared_storage_smoke.py', 'scripts/scheduling_stall_demo.py', 'scripts/runtime_capacity_probe.py', 'scripts/runtime_startup_probe.py', 'scripts/runtime_startup_fence_probe.py', 'scripts/schema_migration_probe.py', 'scripts/admission_cleanup_probe.py', 'scripts/temporal_queue_probe.py', 'scripts/broker_restart_probe.py', 'scripts/worker_release_probe.py', 'render_start.py', 'pyproject.toml', 'uv.lock', '.github/workflows/postgres-runtime.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-storage-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-storage-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify maintenance and payload behavior on SQLite and PostgreSQL
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_storage_maintenance.py tests/test_postgres_storage_maintenance.py tests/test_blob_storage.py tests/test_artifact_files.py
      - name: Migrate through the CLI and restore in a replacement process with no local files
        run: uv run --frozen --python 3.13 python scripts/shared_storage_smoke.py
  runtime-tests:
    name: runtime (${{ matrix.group }})
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix:
        include:
          - group: 01-migration-postgres-migration
            command: |
              uv run --frozen --extra postgres-migration --python 3.13 pytest -q --tb=short tests/test_postgres_migration.py
          - group: 02-migration-postgres-runtime
            command: |
              uv run --frozen --extra postgres-migration --python 3.13 pytest -q --tb=short tests/test_postgres_runtime.py
          - group: 03-postgres-activity
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_activity.py
          - group: 04-postgres-admission-scaling
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_admission_scaling.py
          - group: 05-postgres-agents
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_agents.py
          - group: 06-postgres-astra-ultrafast
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_astra_ultrafast.py
          - group: 07-postgres-attachments
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_attachments.py
          - group: 08-postgres-automation-events
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_automation_events.py
          - group: 09-postgres-automations
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_automations.py
          - group: 10-postgres-broker-transport
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_broker_transport.py
          - group: 11-postgres-cloudflare-login-and-related
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_cloudflare_login.py -k 'conversation or keeps_personal_tools'
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_adoption.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_mission.py
          - group: 12-postgres-credentials
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_credentials.py
          - group: 13-postgres-durable
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_durable.py
          - group: 14-postgres-environments
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_environments.py
          - group: 15-postgres-github-ci
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_github_ci.py
          - group: 16-postgres-github-write-access
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_github_write_access.py
          - group: 17-postgres-harness-gateway
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_harness_gateway.py
          - group: 18-postgres-identities
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_identities.py
          - group: 19-postgres-infrastructure-costs
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_infrastructure_costs.py
          - group: 20-postgres-lens-feedback-and-related
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_lens_feedback.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_types.py
          - group: 21-postgres-memory
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_memory.py
          - group: 22-postgres-message-queue
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_message_queue.py
          - group: 23-postgres-model-preferences-and-related
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_model_preferences.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_session_list_performance.py
          - group: 24-postgres-model-tools
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_model_tools.py
          - group: 25-postgres-pr-delivery
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_pr_delivery.py
          - group: 26-postgres-session-folders
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_session_folders.py
          - group: 27-postgres-session-metadata
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_session_metadata.py
          - group: 28-postgres-session-titles
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_session_titles.py
          - group: 29-postgres-sessions
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_sessions.py
          - group: 30-postgres-skills
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_skills.py
          - group: 31-postgres-slack-chat
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_slack_chat.py
          - group: 32-postgres-slack-feedback-and-related
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_slack_feedback.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_pr_milestones.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_client.py
          - group: 33-postgres-slack-web-mirror
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_slack_web_mirror.py
          - group: 34-postgres-spend
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_spend.py
          - group: 35-postgres-startup-latency
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_startup_latency.py
          - group: 36-postgres-startup-overlap-and-related
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_startup_overlap.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_broker_timing.py
          - group: 37-postgres-swarm-chat-and-related
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_chat.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_automation_concurrency.py
          - group: 38-postgres-swarm-collaboration-and-related
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_collaboration.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_planning.py
          - group: 39-postgres-swarm-time-controls
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_time_controls.py
          - group: 40-postgres-swarm-time-runtime-and-related
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_time_runtime.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_backend.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_conversation_responsiveness.py
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_initial_context.py
          - group: 41-postgres-swarm-timing
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarm_timing.py
          - group: 42-postgres-swarms
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_swarms.py
          - group: 43-postgres-trace-outbox
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_trace_outbox.py
          - group: 44-postgres-workspace
            command: |
              uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_workspace.py
          - group: 45-http-restart-smoke
            command: |
              uv run --frozen --python 3.13 python scripts/postgres_runtime_smoke.py
          - group: 46-sqlite-admission-scaling
            command: |
              uv run --frozen --python 3.13 pytest -q --tb=short tests/test_admission_scaling.py
          - group: 47-sqlite-conversation-responsiveness
            command: |
              uv run --frozen --python 3.13 pytest -q --tb=short tests/test_conversation_responsiveness.py
          - group: 48-sqlite-sessions
            command: |
              uv run --frozen --python 3.13 pytest -q --tb=short tests/test_sessions.py
          - group: 49-sqlite-slack-web-mirror
            command: |
              uv run --frozen --python 3.13 pytest -q --tb=short tests/test_slack_web_mirror.py
          - group: 50-sqlite-spend
            command: |
              uv run --frozen --python 3.13 pytest -q --tb=short tests/test_spend.py
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-runtime-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-runtime-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run selected runtime coverage
        run: ${{ matrix.command }}
  runtime:
    if: ${{ always() }}
    needs: runtime-tests
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every runtime group to pass
        env:
          RUNTIME_RESULT: ${{ needs.runtime-tests.result }}
        run: test "$RUNTIME_RESULT" = success
  scheduling:
    # Keep real Temporal/lock-wait regressions independent of the runtime matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-runtime-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-runtime-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify scheduling under Postgres contention and real Temporal restart
        run: uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_scheduling_diagnostics.py tests/test_temporal_integration.py tests/test_active_steering.py tests/test_steering_latency.py tests/test_automation_environments.py tests/test_automation_parity.py tests/test_automation_temporal.py
      - name: Demonstrate responsive scheduling during Postgres writer and pool waits
        run: uv run --frozen --python 3.13 python scripts/scheduling_stall_demo.py

  distributed:
    runs-on: ubuntu-latest
    # The PostgreSQL lifecycle suites plus three real process probes now take
    # more than ten minutes on hosted runners. Keep every assertion and probe.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-runtime-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-runtime-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify shared admission, execution fencing and real Temporal workers
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_runtime_scaling.py tests/test_runtime_startup_fences.py tests/test_runtime_performance.py tests/test_admission_cleanup.py tests/test_startup_postgres.py
      - name: Verify authenticated capacity observations on both backends
        run: |
          uv run --frozen --python 3.13 pytest -q tests/test_capacity.py tests/test_memory_review.py
          uv run --frozen --python 3.13 pytest --postgres-backend -q tests/test_capacity.py tests/test_memory_review.py
      - name: Verify Slack finish transactions and tracing on both backends
        run: |
          uv run --frozen --python 3.13 pytest -q tests/test_finish_tracing.py
          uv run --frozen --python 3.13 pytest --postgres-backend -q tests/test_finish_tracing.py tests/test_tracing.py
      - name: Verify Slack polling responsiveness and delivery ownership
        run: |
          uv run --frozen --python 3.13 pytest -q tests/test_slack_polling.py
          uv run --frozen --python 3.13 pytest --postgres-backend -q tests/test_slack_polling.py tests/test_slack_activity.py
      - name: Verify 3000 synthetic reservations across four worker processes
        run: uv run --frozen --python 3.13 python scripts/runtime_capacity_probe.py --sessions 3000 --workers 4
      - name: Verify agent handoffs, warm workspaces and admission on PostgreSQL
        run: uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_agents.py tests/test_admission_scaling.py tests/test_idle_window.py
      - name: Measure admission while another sandbox termination is slow
        run: uv run --frozen --python 3.13 python scripts/admission_cleanup_probe.py
      - name: Measure wake delivery and admission under database contention
        run: uv run --frozen --python 3.13 python scripts/runtime_startup_probe.py
      - name: Measure real local Temporal queueing at bounded activity capacity
        run: uv run --frozen --python 3.13 python scripts/temporal_queue_probe.py

  broker:
    # Keep broker continuity and context recovery independent of the longer
    # distributed-worker load probes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-broker-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-broker-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify broker ownership, recovery, isolation and release compatibility
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_separate_broker.py tests/test_api_lifecycle.py tests/test_api_compatibility.py
      - name: Verify explicit migrations and runtime startup without DDL
        run: |
          uv run --frozen --python 3.13 pytest -q --tb=short tests/test_schema_migrations.py
          uv run --frozen --python 3.13 python -m scripts.schema_migration_probe --output /tmp/moyai-schema-proof
      - name: Verify rejected starts preserve live runtime state before schema writes
        run: uv run --frozen --python 3.13 python -m scripts.runtime_startup_fence_probe --output /tmp/moyai-startup-fences
      - name: Verify native inference survives a separate API process restart
        run: uv run --frozen --python 3.13 python -m scripts.broker_restart_probe
      - name: Verify two APIs overlap without restarting the coordinator or inference
        run: uv run --frozen --python 3.13 python -m scripts.broker_restart_probe --replicated-api
      - name: Verify compatible API source builds overlap and incompatible contracts fail closed
        run: uv run --frozen --python 3.13 python -m scripts.broker_restart_probe --mixed-build-api --drain-api
      - name: Verify context recovery on both backends
        run: |
          uv run --frozen --python 3.13 pytest -q --tb=short tests/test_context_gateway.py tests/test_context_recovery.py
          uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_context_gateway.py tests/test_context_recovery.py

  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-rolling-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-rolling-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify compatible owners, revocation, stream draining and failed handoffs
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_background_contracts.py tests/test_worker_compatibility.py tests/test_worker_release_fences.py tests/test_worker_handoff.py tests/test_coordinator_handoff.py tests/test_broker_overlap.py
      - name: Replace all four roles while messages and inference continue
        run: uv run --frozen --python 3.13 python -m scripts.worker_release_probe --all-roles --output /tmp/moyai-rolling-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rolling-release-proof
          path: /tmp/moyai-rolling-release
          if-no-files-found: ignore
