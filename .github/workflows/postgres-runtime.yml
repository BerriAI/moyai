name: PostgreSQL runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shared-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: local-runtime-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-runtime-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra postgres-migration
      - run: uv run --frozen --extra postgres-migration pytest -q tests --ignore=tests/release --tb=short
      - run: uv run --frozen --extra postgres-migration pytest --postgres-backend -q tests/test_database_boundaries.py tests/test_message_snapshot_pool.py --tb=short
