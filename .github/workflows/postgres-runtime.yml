name: PostgreSQL runtime
on:
  pull_request:
    paths: ['app/**', 'tests/**', 'scripts/postgres_runtime_smoke.py', 'scripts/shared_storage_smoke.py', 'scripts/scheduling_stall_demo.py', 'scripts/runtime_capacity_probe.py', 'scripts/runtime_startup_probe.py', 'scripts/runtime_startup_fence_probe.py', 'scripts/schema_migration_probe.py', 'scripts/admission_cleanup_probe.py', 'scripts/temporal_queue_probe.py', 'scripts/broker_restart_probe.py', 'scripts/worker_release_probe.py', 'render_start.py', 'pyproject.toml', 'uv.lock', '.github/workflows/postgres-runtime.yml']
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # Superseded PR revisions need no result; retain checks for every main commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-storage-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-storage-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify maintenance and payload behavior on SQLite and PostgreSQL
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_storage_maintenance.py tests/test_postgres_storage_maintenance.py tests/test_blob_storage.py tests/test_artifact_files.py
      - name: Migrate through the CLI and restore in a replacement process with no local files
        run: uv run --frozen --python 3.13 python scripts/shared_storage_smoke.py
  runtime:
    # Database contracts stay on every PR. General feature compatibility runs
    # nightly/on demand in postgres-compatibility.yml instead of once per PR.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-runtime-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-runtime-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Preserve SQLite admission behavior
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_admission_scaling.py
      - name: Verify Postgres transactions, ownership, import and restart
        # The import contract needs sqlglot; full migration coverage has its own workflow.
        run: uv run --frozen --extra postgres-migration --python 3.13 pytest -q --tb=short tests/test_postgres_runtime.py
      - name: Verify conversation authentication remains readable during writes
        run: uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_cloudflare_login.py -k 'conversation or keeps_personal_tools'
      - name: Demonstrate real HTTP requests across two server processes
        run: uv run --frozen --python 3.13 python scripts/postgres_runtime_smoke.py
  scheduling:
    # Keep real Temporal and database-contention guarantees on every PR.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-runtime-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-runtime-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify scheduling under Postgres contention and real Temporal restart
        run: uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_scheduling_diagnostics.py tests/test_temporal_integration.py tests/test_active_steering.py tests/test_steering_latency.py tests/test_automation_environments.py tests/test_automation_parity.py tests/test_automation_temporal.py
      - name: Demonstrate responsive scheduling during Postgres writer and pool waits
        run: uv run --frozen --python 3.13 python scripts/scheduling_stall_demo.py

  distributed:
    runs-on: ubuntu-latest
    # Keep lifecycle and contention regressions here; the 3000-session load
    # measurement runs in the scheduled/manual compatibility workflow.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-runtime-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-runtime-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify shared admission, execution fencing and real Temporal workers
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_runtime_scaling.py tests/test_runtime_startup_fences.py tests/test_runtime_performance.py tests/test_admission_cleanup.py tests/test_startup_postgres.py
      - name: Verify authenticated capacity observations on both backends
        run: |
          uv run --frozen --python 3.13 pytest -q tests/test_capacity.py tests/test_memory_review.py
          uv run --frozen --python 3.13 pytest --postgres-backend -q tests/test_capacity.py tests/test_memory_review.py
      - name: Verify Slack finish transactions and tracing on both backends
        run: |
          uv run --frozen --python 3.13 pytest -q tests/test_finish_tracing.py
          uv run --frozen --python 3.13 pytest --postgres-backend -q tests/test_finish_tracing.py tests/test_tracing.py
      - name: Verify Slack polling responsiveness and delivery ownership
        run: |
          uv run --frozen --python 3.13 pytest -q tests/test_slack_polling.py
          uv run --frozen --python 3.13 pytest --postgres-backend -q tests/test_slack_polling.py tests/test_slack_activity.py
      - name: Verify chat snapshots reuse PostgreSQL pool connections
        run: uv run --frozen --python 3.13 pytest --postgres-backend -q tests/test_message_snapshot_pool.py tests/test_slack_mentions.py tests/test_attachments.py
      - name: Verify agent handoffs, warm workspaces and admission on PostgreSQL
        run: uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_agents.py tests/test_admission_scaling.py tests/test_idle_window.py
      - name: Measure admission while another sandbox termination is slow
        run: uv run --frozen --python 3.13 python scripts/admission_cleanup_probe.py
      - name: Measure wake delivery and admission under database contention
        run: uv run --frozen --python 3.13 python scripts/runtime_startup_probe.py
      - name: Measure real local Temporal queueing at bounded activity capacity
        run: uv run --frozen --python 3.13 python scripts/temporal_queue_probe.py

  broker:
    # Keep broker continuity and context recovery independent of the longer
    # distributed-worker load probes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-broker-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-broker-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify broker ownership, recovery, isolation and release compatibility
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_separate_broker.py tests/test_api_lifecycle.py tests/test_api_compatibility.py
      - name: Verify explicit migrations and runtime startup without DDL
        run: |
          uv run --frozen --python 3.13 pytest -q --tb=short tests/test_schema_migrations.py
          uv run --frozen --python 3.13 python -m scripts.schema_migration_probe --output /tmp/moyai-schema-proof
      - name: Verify rejected starts preserve live runtime state before schema writes
        run: uv run --frozen --python 3.13 python -m scripts.runtime_startup_fence_probe --output /tmp/moyai-startup-fences
      - name: Verify native inference survives a separate API process restart
        run: uv run --frozen --python 3.13 python -m scripts.broker_restart_probe
      - name: Verify two APIs overlap without restarting the coordinator or inference
        run: uv run --frozen --python 3.13 python -m scripts.broker_restart_probe --replicated-api
      - name: Verify compatible API source builds overlap and incompatible contracts fail closed
        run: uv run --frozen --python 3.13 python -m scripts.broker_restart_probe --mixed-build-api --drain-api
      - name: Verify context recovery on both backends
        run: |
          uv run --frozen --python 3.13 pytest -q --tb=short tests/test_context_gateway.py tests/test_context_recovery.py
          uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short tests/test_context_gateway.py tests/test_context_recovery.py

  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-rolling-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-rolling-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify compatible owners, revocation, stream draining and failed handoffs
        run: uv run --frozen --python 3.13 pytest -q --tb=short tests/test_background_contracts.py tests/test_worker_compatibility.py tests/test_worker_release_fences.py tests/test_worker_handoff.py tests/test_coordinator_handoff.py tests/test_broker_overlap.py
      - name: Replace all four roles while messages and inference continue
        run: uv run --frozen --python 3.13 python -m scripts.worker_release_probe --all-roles --output /tmp/moyai-rolling-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rolling-release-proof
          path: /tmp/moyai-rolling-release
          if-no-files-found: ignore
