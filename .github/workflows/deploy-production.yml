name: Deploy production
run-name: Deploy latest main to Moyai production

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: API replaces a compatible API/UI; rolling replaces compatible native roles; maintenance handles schema or protocol upgrades
        type: choice
        options: [rolling, api, coordinated, maintenance]
        default: maintenance
      execution_core:
        description: Use preserve for API or rolling releases; pydantic selects the maintenance upgrade
        type: choice
        options: [pydantic, preserve]
        default: pydantic
      preflight_only:
        description: Optional check only (every deployment already runs preflight)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: moyai-production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.repository == 'BerriAI/moyai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Native same-core maintenance uses 8 deployments in 5 batches; core switches use 10.
    timeout-minutes: 300
    environment: moyai-production
    steps:
      # Deploy the same main commit as checkout, selected at button press.
      # A later push cannot change this release's tooling or deployment target.
      - uses: actions/checkout@v4
      - name: Validate explicit core selection before credentials are loaded
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          EXECUTION_CORE: ${{ inputs.execution_core }}
        run: |
          if [ "$EXECUTION_CORE" != preserve ] && [ "$RELEASE_TYPE" != maintenance ]; then
            echo 'Explicit core selection requires a maintenance release.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        if: inputs.release_type != 'coordinated'
      - name: Install candidate settings dependencies before loading deployment credentials
        if: inputs.release_type != 'coordinated'
        run: uv sync --frozen --python 3.13
      - name: Coordinate app, worker and activated broker deployment
        if: inputs.release_type == 'coordinated'
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_API_KEY: ${{ secrets.RENDER_DEPLOY_API_KEY }}
          RENDER_DEPLOY_SSH_KEY: ${{ secrets.RENDER_DEPLOY_SSH_KEY }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          MOYAI_API_SERVICE_ID: ${{ vars.MOYAI_API_SERVICE_ID }}
        run: python3 -m scripts.release.deploy --receipt release-receipt.json
      - name: Replace the compatible API while background work continues
        if: inputs.release_type == 'api'
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_API_KEY: ${{ secrets.RENDER_DEPLOY_API_KEY }}
          RENDER_DEPLOY_SSH_KEY: ${{ secrets.RENDER_DEPLOY_SSH_KEY }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          MOYAI_API_SERVICE_ID: ${{ vars.MOYAI_API_SERVICE_ID }}
        run: .venv/bin/python -m scripts.release.deploy --release-type api --receipt release-receipt.json
      - name: Replace compatible roles sequentially while work continues
        if: inputs.release_type == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_API_KEY: ${{ secrets.RENDER_DEPLOY_API_KEY }}
          RENDER_DEPLOY_SSH_KEY: ${{ secrets.RENDER_DEPLOY_SSH_KEY }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          MOYAI_API_SERVICE_ID: ${{ vars.MOYAI_API_SERVICE_ID }}
        run: .venv/bin/python -m scripts.release.deploy --release-type rolling --receipt release-receipt.json
      - name: Drain and replace all four roles during a planned maintenance window
        if: inputs.release_type == 'maintenance'
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_API_KEY: ${{ secrets.RENDER_DEPLOY_API_KEY }}
          RENDER_DEPLOY_SSH_KEY: ${{ secrets.RENDER_DEPLOY_SSH_KEY }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          MOYAI_API_SERVICE_ID: ${{ vars.MOYAI_API_SERVICE_ID }}
          EXECUTION_CORE: ${{ inputs.execution_core }}
        run: .venv/bin/python -m scripts.release.deploy --release-type maintenance --core "$EXECUTION_CORE" --receipt release-receipt.json
      - name: Save deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}
          path: release-receipt.json
          if-no-files-found: warn
          retention-days: 30
