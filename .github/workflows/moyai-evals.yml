name: Moyai agent evals
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop-integration:
    name: Desktop integration (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Build the desktop with Chromium and pinned OCU
        run: docker build -t moyai-desktop-test evals/tasks/desktop_license/environment
      - name: Check real desktop actions, worker recovery, and browser failures
        run: docker run --rm --network none -v "$PWD:/repo:ro" moyai-desktop-test python /repo/evals/desktop/smoke.py
  moyai-agent-evals:
    name: Moyai agent evals
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: eval-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LITELLM_API_BASE: ${{ vars.MOYAI_EVAL_GATEWAY_URL || secrets.MOYAI_EVAL_LITELLM_API_BASE }}
      LITELLM_API_KEY: ${{ secrets.MOYAI_EVAL_GATEWAY_KEY || secrets.MOYAI_EVAL_LITELLM_API_KEY }}
      MOYAI_EVAL_AGENT_MODEL: ${{ vars.MOYAI_EVAL_AGENT_MODEL || vars.MOYAI_EVAL_MODEL }}
      MOYAI_EVAL_JUDGE_MODEL: ${{ vars.MOYAI_EVAL_JUDGE_MODEL || vars.MOYAI_EVAL_MODEL || vars.MOYAI_EVAL_AGENT_MODEL }}
      MOYAI_TEST_POSTGRES: postgresql://postgres:eval-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Check eval configuration
        run: |
          missing=0
          for name in LITELLM_API_BASE LITELLM_API_KEY MOYAI_EVAL_AGENT_MODEL MOYAI_EVAL_JUDGE_MODEL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required model evaluation setting is missing: $name"
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then
            echo "Model quality is **not evaluated**: required configuration is missing. See evals/README.md." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - <<'PY'
          import os
          import socket
          from pathlib import Path
          from urllib.parse import urlsplit

          try:
              url = urlsplit(os.environ["LITELLM_API_BASE"])
              if url.scheme not in {"https", "http"} or not url.hostname or url.username or url.password:
                  raise ValueError("Expected an HTTP(S) gateway URL without embedded credentials.")
              with socket.create_connection((url.hostname, url.port or (443 if url.scheme == "https" else 80)), timeout=10):
                  pass
          except (OSError, ValueError):
              message = (
                  "Model quality is **not evaluated**: the evaluation gateway is invalid or unreachable "
                  "from this runner. Check MOYAI_EVAL_GATEWAY_URL, DNS and runner network access."
              )
              print("::error::" + message)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write(message + "\n")
              raise SystemExit(1)
          PY
          {
            echo "Model evaluations configured for commit \`$GITHUB_SHA\`."
            echo "- Agent: \`$MOYAI_EVAL_AGENT_MODEL\`"
            echo "- Judge: \`$MOYAI_EVAL_JUDGE_MODEL\`"
            echo "- Gate: at least 2 successful trials out of 3 for every task."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          python-version: '3.13'
      - name: Run Harbor evaluation
        id: evaluation
        env:
          PYTHONPATH: .:evals:native/src:native/tests
        run: |
          for task in evals/tasks/*/; do
            agent=moyai_harbor.agent:MoyaiAgent
            if [[ "$task" == evals/tasks/desktop_* ]]; then
              agent=moyai_harbor.desktop_agent:MoyaiDesktopAgent
            fi
            uv run --project native --python 3.13 --with harbor==0.24.0 --with 'moto[server]==5.1.4' --with openai==3.29.0 --with litellm==1.107.0.dev3 harbor run \
              -p "$task" \
              -a "$agent" \
              -k 3 -n 1 -o evals/jobs -y
          done
      - name: Report eval result
        if: always() && steps.evaluation.outcome != 'skipped'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          jobs_root = Path("evals/jobs")
          jobs = [path for path in jobs_root.iterdir() if path.is_dir()] if jobs_root.is_dir() else []
          tasks = sorted(path.name for path in Path("evals/tasks").iterdir() if path.is_dir())
          summary = ["| Task | Trial | Reward |", "| --- | --- | ---: |"]
          failed = []
          for task in tasks:
              trials = sorted(
                  (trial for job in jobs for trial in job.iterdir()
                   if trial.is_dir() and trial.name.startswith(f"{task}__")),
                  key=lambda path: path.stat().st_mtime,
              )[-3:]
              passed = 0
              for index in range(3):
                  if index < len(trials):
                      trial = trials[index]
                      try:
                          reward = float((trial / "verifier" / "reward.txt").read_text().strip())
                      except (OSError, ValueError):
                          reward = 0.0
                      label = trial.name
                  else:
                      reward = 0.0
                      label = f"Trial {index + 1} (missing)"
                  passed += reward == 1.0
                  summary.append(f"| {task} | {label} | {reward:g} |")
              print(f"{task}: passed {passed}/3")
              if passed < 2:
                  failed.append(task)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write("\n".join(summary) + "\n")
          if failed:
              print(f"::warning::Moyai evals below 2/3 trials: {', '.join(failed)}")
              raise SystemExit(1)
          PY
      - name: Upload Harbor jobs
        if: always() && steps.evaluation.outcome != 'skipped'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: moyai-harbor-jobs
          path: evals/jobs/
          if-no-files-found: error
  fork-evaluation-notice:
    name: Model evaluation unavailable for fork
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain model evaluation coverage
        run: |
          echo "::notice::Model evaluations did not run: fork pull requests cannot access evaluation credentials."
          echo "Model quality is **not evaluated** for this fork PR. The model evaluation job is skipped. A maintainer must review the changes before running them on a trusted branch; deterministic checks do not establish model quality." >> "$GITHUB_STEP_SUMMARY"
