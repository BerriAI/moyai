name: Moyai agent evals
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-chat-tests:
    name: Local agent chat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run typecheck:eval-chat
      - run: npm run build:eval-chat
      - run: npx playwright install --with-deps chromium
      - run: npm run test:eval-chat
      - run: uv run --frozen ruff check evals/moyai_harbor evals/tests scripts/local_agent_chat.py
      - name: Test local chat without provider credentials
        env:
          PYTHONPATH: .:evals:native/src:native/tests
        run: >-
          uv run --frozen --project native --with harbor==0.24.0
          --with openai==3.29.0 --with litellm==1.107.0.dev3
          python -m pytest -q evals/tests
  moyai-agent-evals:
    name: Moyai agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: eval-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LITELLM_API_BASE: ${{ secrets.MOYAI_EVAL_LITELLM_API_BASE }}
      LITELLM_API_KEY: ${{ secrets.MOYAI_EVAL_LITELLM_API_KEY }}
      MOYAI_EVAL_AGENT_MODEL: ${{ vars.MOYAI_EVAL_AGENT_MODEL }}
      MOYAI_EVAL_JUDGE_MODEL: ${{ vars.MOYAI_EVAL_JUDGE_MODEL }}
      MOYAI_TEST_POSTGRES: postgresql://postgres:eval-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Check eval configuration
        id: eval-config
        run: |
          if [[ -z "$LITELLM_API_BASE" || -z "$LITELLM_API_KEY" ]]; then
            echo "::notice::Moyai agent eval skipped because the LiteLLM secrets are not configured"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$MOYAI_EVAL_AGENT_MODEL" || -z "$MOYAI_EVAL_JUDGE_MODEL" ]]; then
            echo "::notice::Moyai agent eval skipped because the model variables are not configured"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.eval-config.outputs.enabled == 'true'
        with:
          python-version: '3.13'
      - name: Run Harbor evaluation
        if: steps.eval-config.outputs.enabled == 'true'
        env:
          PYTHONPATH: .:evals:native/src:native/tests
        run: |
          for task in evals/tasks/*/; do
            uv run --project native --python 3.13 --with harbor==0.24.0 --with openai==3.29.0 --with litellm==1.107.0.dev3 harbor run \
              -p "$task" \
              -a moyai_harbor.agent:MoyaiAgent \
              -k 3 -n 1 -o evals/jobs -y
          done
      - name: Report eval result
        if: always() && steps.eval-config.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          jobs_root = Path("evals/jobs")
          jobs = [path for path in jobs_root.iterdir() if path.is_dir()] if jobs_root.is_dir() else []
          tasks = sorted(path.name for path in Path("evals/tasks").iterdir() if path.is_dir())
          summary = ["| Task | Trial | Reward |", "| --- | --- | ---: |"]
          failed = []
          for task in tasks:
              trials = sorted(
                  (trial for job in jobs for trial in job.iterdir()
                   if trial.is_dir() and trial.name.startswith(f"{task}__")),
                  key=lambda path: path.stat().st_mtime,
              )[-3:]
              passed = 0
              for index in range(3):
                  if index < len(trials):
                      trial = trials[index]
                      try:
                          reward = float((trial / "verifier" / "reward.txt").read_text().strip())
                      except (OSError, ValueError):
                          reward = 0.0
                      label = trial.name
                  else:
                      reward = 0.0
                      label = f"Trial {index + 1} (missing)"
                  passed += reward == 1.0
                  summary.append(f"| {task} | {label} | {reward:g} |")
              print(f"{task}: passed {passed}/3")
              if passed < 2:
                  failed.append(task)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write("\n".join(summary) + "\n")
          if failed:
              print(f"::warning::Moyai evals below 2/3 trials: {', '.join(failed)}")
              raise SystemExit(1)
          PY
      - name: Upload Harbor jobs
        if: always() && steps.eval-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moyai-harbor-jobs
          path: evals/jobs/
          if-no-files-found: warn
