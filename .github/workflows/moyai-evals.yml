name: Moyai agent evals
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  moyai-agent-evals:
    name: Moyai agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: eval-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LITELLM_API_BASE: ${{ secrets.MOYAI_EVAL_LITELLM_API_BASE }}
      LITELLM_API_KEY: ${{ secrets.MOYAI_EVAL_LITELLM_API_KEY }}
      MOYAI_EVAL_AGENT_MODEL: ${{ vars.MOYAI_EVAL_AGENT_MODEL }}
      MOYAI_EVAL_JUDGE_MODEL: ${{ vars.MOYAI_EVAL_JUDGE_MODEL }}
      MOYAI_TEST_POSTGRES: postgresql://postgres:eval-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test evaluation reporting
        env:
          PYTHONPATH: .:evals:native/src
        run: |
          uv run --project native --frozen --python 3.13 \
            --with reportlab==4.4.10 --with pypdf \
            pytest -q evals/tests
      - name: Check eval configuration
        id: eval-config
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]] && \
             [[ -z "$LITELLM_API_BASE" || -z "$LITELLM_API_KEY" || \
                -z "$MOYAI_EVAL_AGENT_MODEL" || -z "$MOYAI_EVAL_JUDGE_MODEL" ]]; then
            echo "::notice::Moyai agent eval skipped because the LiteLLM secrets or model variables are not configured"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Run Harbor evaluation and generate PDF
        if: steps.eval-config.outputs.enabled == 'true'
        env:
          PYTHONPATH: evals
        run: |
          uv run --no-project --python 3.13 \
            --with reportlab==4.4.10 --with 'python-dotenv>=1,<2' \
            python -m moyai_harbor.run_report --output-root evals/reports
      - name: Add evaluation summary
        if: always() && steps.eval-config.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pointer = Path("evals/reports/latest-report.json")
          if pointer.is_file():
              report = json.loads(pointer.read_text())
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
                  stream.write(Path(report["summary_txt"]).read_text())
          else:
              print("::warning::The evaluation did not produce a report pointer")
          PY
      - name: Upload evaluation reports
        if: always() && steps.eval-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moyai-harbor-report
          path: |
            evals/reports/*/report/report.json
            evals/reports/*/report/report.pdf
            evals/reports/*/report/summary.txt
          if-no-files-found: warn
