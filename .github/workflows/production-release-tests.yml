name: Production release rehearsal
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic-release-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:synthetic-release-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: Verify release ordering, failures and real PostgreSQL drain guards
        run: uv run --frozen --python 3.13 pytest -q tests/release tests/test_render.py tests/test_render_shutdown.py tests/test_online_migrations.py
      - name: Keep old and new readers working through a real additive migration
        run: uv run --frozen --python 3.13 python -m scripts.online_migration_probe --output /tmp/moyai-online-migration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-migration-proof
          path: /tmp/moyai-online-migration
          if-no-files-found: ignore
