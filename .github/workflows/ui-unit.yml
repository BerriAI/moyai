name: UI unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # Own all legacy and native Node unit tests, including changes that only
    # trigger Docker or native CI. Browser and build checks keep their own jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Install the locked Python schemas used by UI contract checks
        run: uv sync --project native --frozen --python 3.13 --extra product
      - run: npm test
