name: Substrate sandboxes
on:
  pull_request:
    paths:
      - 'app/**'
      - 'sandbox/**'
      - 'scripts/substrate*'
      - 'Dockerfile.sandbox'
      - '.github/workflows/substrate.yml'
      - 'tests/test_sandbox*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: substrate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  substrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KIND_CLUSTER_NAME: moyai-test
      KUBECTL_CONTEXT: kind-moyai-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Unit and protocol tests
        run: uv run --python 3.13 pytest -q --tb=line tests/test_sandbox_providers.py tests/test_runner.py tests/test_durable.py tests/test_environments.py tests/test_environment_discovery.py tests/test_infrastructure_costs.py
      - uses: actions/checkout@v4
        with:
          repository: agent-substrate/substrate
          ref: 92b74c0ee45aee6578a1a3d468f9f56b95074050
          path: .substrate
      - uses: actions/cache/restore@v4
        id: substrate-go-cache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: substrate-go-1.27-${{ runner.os }}-${{ runner.arch }}-92b74c0
      - name: Pull the pinned local registry from the official mirror
        run: |
          docker pull public.ecr.aws/docker/library/registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          docker tag public.ecr.aws/docker/library/registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8 registry:3
      - name: Create disposable Kubernetes cluster
        working-directory: .substrate
        run: hack/create-kind-cluster.sh
      - name: Use verified mirrors for the pinned Substrate image stages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.substrate/cmd/dataplane/envoy/Dockerfile')
          mirrors = {
              'rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e': 'public.ecr.aws/docker/library/',
              'envoyproxy/envoy:v1.39.1@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4': 'mirror.gcr.io/',
          }
          source = path.read_text()
          stages = [line.split()[1] for line in source.splitlines() if line.startswith('FROM ')]
          if sorted(stages) != sorted(mirrors):
              raise SystemExit('The pinned Substrate image stages changed; revalidate their mirrors.')
          for image, registry in mirrors.items():
              source = source.replace(f'FROM {image}', f'FROM {registry}{image}', 1)
          path.write_text(source)
          PY
      - name: Install real Substrate and two sandbox workers
        working-directory: .substrate
        run: hack/install-ate-kind.sh --deploy-ate-system --credential-provider='{"enabled":false}' --deploy-demo-sandbox
      - uses: actions/cache/save@v4
        if: steps.substrate-go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: substrate-go-1.27-${{ runner.os }}-${{ runner.arch }}-92b74c0
      - name: Build Moyai runtime image
        run: |
          docker build -f Dockerfile.sandbox -t localhost:5001/moyai-sandbox:test .
          docker push localhost:5001/moyai-sandbox:test
      - name: Configure template and run live lifecycle tests
        env:
          MOYAI_SMOKE_FULL_IMAGE: '1'
        run: uv run python scripts/substrate_ci.py
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -80
          kubectl logs -n ate-system deployment/ate-api-server --all-pods=true --tail=150 || true
          kubectl logs -n ate-system deployment/atenet-router --all-pods=true --all-containers=true --tail=80 || true
          kubectl logs -n ate-demo-sandbox deployment/sandbox-workerpool --all-pods=true --tail=150 || true
      - name: Delete disposable cluster
        if: always()
        working-directory: .substrate
        run: hack/kind.sh delete cluster --name moyai-test
