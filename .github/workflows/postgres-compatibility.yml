name: PostgreSQL compatibility
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    # Keep the broad feature compatibility sweep off the PR path. Database
    # contracts and contention regressions stay in postgres-runtime.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: chat
            tests: >-
              tests/test_workspace.py tests/test_sessions.py
              tests/test_conversation_responsiveness.py tests/test_session_list_performance.py
              tests/test_session_titles.py tests/test_session_metadata.py
              tests/test_pr_delivery.py tests/test_pr_milestones.py tests/test_github_ci.py
              tests/test_attachments.py tests/test_message_queue.py tests/test_trace_outbox.py
          - group: features
            tests: >-
              tests/test_credentials.py tests/test_skills.py tests/test_bundled_skills.py tests/test_memory.py
              tests/test_initial_context.py tests/test_automations.py tests/test_automation_events.py
              tests/test_environments.py tests/test_infrastructure_costs.py
              tests/test_session_folders.py tests/test_spend.py
              tests/test_github_write_access.py tests/test_github_coding.py tests/test_lens_feedback.py
          - group: workers
            # admission_scaling and agents already run on Postgres in the
            # PR workflow's distributed job; do not run them a second time.
            tests: >-
              tests/test_durable.py tests/test_startup_latency.py tests/test_startup_overlap.py
              tests/test_automation_concurrency.py tests/test_harness_gateway.py
              tests/test_broker_transport.py tests/test_adoption.py tests/test_identities.py
              tests/test_slack_chat.py tests/test_slack_feedback.py
              tests/test_slack_web_mirror.py tests/test_activity.py
          - group: models-and-swarms
            tests: >-
              tests/test_astra_ultrafast.py tests/test_model_preferences.py tests/test_model_tools.py
              tests/test_swarms.py tests/test_swarm_backend.py tests/test_swarm_collaboration.py
              tests/test_swarm_client.py tests/test_swarm_types.py tests/test_swarm_mission.py
              tests/test_swarm_planning.py tests/test_swarm_timing.py tests/test_swarm_time_controls.py
              tests/test_swarm_time_runtime.py tests/test_swarm_broker_timing.py tests/test_swarm_chat.py
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-compatibility-test
          POSTGRES_DB: moyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOYAI_TEST_POSTGRES_URL: postgresql://postgres:local-compatibility-test@127.0.0.1:5432/moyai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify ${{ matrix.group }} feature compatibility on Postgres
        env:
          TEST_FILES: ${{ matrix.tests }}
        run: |
          read -r -a test_files <<< "$TEST_FILES"
          uv run --frozen --python 3.13 pytest --postgres-backend -q --tb=short "${test_files[@]}"
      - name: Verify 3000 synthetic reservations across four worker processes
        if: matrix.group == 'workers'
        run: uv run --frozen --python 3.13 python scripts/runtime_capacity_probe.py --sessions 3000 --workers 4
