# Bootstrap template: install as .github/workflows/deploy-production.yml in
# the PRIVATE BerriAI/moyai-ops repo only after following README.md.
name: Deploy Moyai production
run-name: Moyai ${{ inputs.source_sha }} (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character Moyai main commit, containing private-workflow support
        required: true
        type: string
      release_type:
        description: Compatible rolling/API release or planned maintenance
        type: choice
        options: [rolling, api, coordinated, maintenance]
        default: rolling
      execution_core:
        description: Preserve the running core unless explicitly upgrading during maintenance
        type: choice
        options: [preserve, pydantic]
        default: preserve
      preflight_only:
        description: Check CI and production without changing it
        type: boolean
        default: true
      consolidate_billing:
        description: Consolidate already-backfilled billing tables during maintenance
        type: boolean
        default: false

permissions: {}

concurrency:
  group: moyai-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'BerriAI/moyai-ops' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: moyai-production
    steps:
      - name: Create a source-repository read token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: source-token
        with:
          app-id: ${{ secrets.MOYAI_SOURCE_APP_ID }}
          private-key: ${{ secrets.MOYAI_SOURCE_APP_PRIVATE_KEY }}
          owner: BerriAI
          repositories: moyai
          permission-contents: read
          permission-actions: read
          permission-checks: read
          permission-statuses: read
      - name: Admit only an exact source commit already on Moyai main
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full Moyai SHA is required.'; exit 1; }
          gh api "repos/BerriAI/moyai/compare/$SOURCE_SHA...main" |
            jq -e --arg sha "$SOURCE_SHA" \
              '(.status == "ahead" or .status == "identical") and
               .base_commit.sha == $sha and .merge_base_commit.sha == $sha' >/dev/null
      - uses: actions/checkout@v4
        with:
          repository: BerriAI/moyai
          ref: ${{ inputs.source_sha }}
          path: source
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
      - name: Validate the source checkout before installing candidate dependencies
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -m scripts.release.deploy --source-sha "$SOURCE_SHA" --check-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install locked candidate dependencies
        working-directory: source
        run: uv sync --frozen --python 3.13
      - name: Run the selected Moyai release
        working-directory: source
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          EXECUTION_CORE: ${{ inputs.execution_core }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          CONSOLIDATE_BILLING: ${{ inputs.consolidate_billing }}
          RENDER_DEPLOY_API_KEY: ${{ secrets.RENDER_DEPLOY_API_KEY }}
          RENDER_DEPLOY_SSH_KEY: ${{ secrets.RENDER_DEPLOY_SSH_KEY }}
          MOYAI_API_SERVICE_ID: ${{ vars.MOYAI_API_SERVICE_ID }}
        run: |
          .venv/bin/python -m scripts.release.deploy \
            --source-sha "$SOURCE_SHA" --release-type "$RELEASE_TYPE" \
            --core "$EXECUTION_CORE" --receipt "$RUNNER_TEMP/release-receipt.json"
      - name: Save deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: warn
          retention-days: 30
