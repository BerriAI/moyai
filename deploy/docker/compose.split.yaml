services:
  setup:
    extends:
      file: compose.common.yaml
      service: setup
    environment:
      MOYAI_INSTALL_TOPOLOGY: split
    volumes:
      - moyai-ingress:/data/ingress
  coordinator:
    extends:
      file: compose.common.yaml
      service: runtime
    command: ["/app/.venv/bin/python", "-m", "moyai.deployment", "serve", "coordinator"]
    environment:
      MOYAI_INSTALL_TOPOLOGY: split
    depends_on:
      setup:
        condition: service_completed_successfully
  broker:
    extends:
      file: compose.common.yaml
      service: runtime
    command: ["/app/.venv/bin/python", "-m", "moyai.deployment", "serve", "broker"]
    environment:
      MOYAI_INSTALL_TOPOLOGY: split
    depends_on:
      coordinator:
        condition: service_healthy
  worker:
    extends:
      file: compose.common.yaml
      service: runtime
    command: ["/app/.venv/bin/python", "-m", "moyai.deployment", "serve", "worker"]
    environment:
      MOYAI_INSTALL_TOPOLOGY: split
    depends_on:
      broker:
        condition: service_healthy
  api:
    extends:
      file: compose.common.yaml
      service: runtime
    command: ["/app/.venv/bin/python", "-m", "moyai.deployment", "serve", "api"]
    environment:
      MOYAI_INSTALL_TOPOLOGY: split
    depends_on:
      coordinator:
        condition: service_healthy
  activate:
    extends:
      file: compose.common.yaml
      service: setup
    command: ["/app/.venv/bin/python", "-m", "moyai.deployment", "activate"]
    environment:
      MOYAI_INSTALL_TOPOLOGY: split
    volumes:
      - moyai-ingress:/data/ingress
    depends_on:
      proxy:
        condition: service_healthy
  proxy:
    environment:
      MOYAI_BASE_PATH: ${MOYAI_BASE_PATH:-}
      NGINX_ENVSUBST_FILTER: ^MOYAI_BASE_PATH$
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "${MOYAI_BIND_ADDRESS:-127.0.0.1}:${MOYAI_PORT:-8787}:8080"
    volumes:
      - ./nginx.split.conf:/etc/nginx/templates/default.conf.template:ro
      - moyai-ingress:/ingress:ro
    depends_on:
      worker:
        condition: service_healthy
      api:
        condition: service_healthy
        restart: true
      broker:
        condition: service_healthy
        restart: true
      coordinator:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  moyai-state:
  moyai-ingress:
