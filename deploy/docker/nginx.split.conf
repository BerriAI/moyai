map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 21m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    # Load balancers must admit broker traffic before execution is resumed.
    location = /health {
        proxy_pass http://api:8787/health;
    }
    location = ${MOYAI_BASE_PATH}/broker/health {
        proxy_pass http://broker:8787/health;
    }
    location ${MOYAI_BASE_PATH}/broker/ {
        proxy_pass http://broker:8787;
    }
    location ${MOYAI_BASE_PATH}/hooks/ {
        if (!-f /ingress/ready) { return 503; }
        proxy_pass http://coordinator:8787;
    }
    location / {
        if (!-f /ingress/ready) { return 503; }
        proxy_pass http://api:8787;
    }
}
