[project]
name = "hermes-workspace"
version = "0.1.0"
description = "An internal agent workspace with Hermes, Modal sandboxes, and native app connections."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "openai-agents==0.17.3",
  # Compatible SDK usage schema; covered by real SDK transport tests.
  "openai==2.26.0",
  "cryptography>=44",
  "pydantic-settings>=2.8,<3",
  "modal>=1.4,<2",
  "grpclib>=0.4.9,<1",
  "protobuf>=6.33.6,<7",
  "itsdangerous>=2.2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "agentchat",
  "temporalio>=1.20,<2",
  "pillow>=11.3,<13",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "boto3>=1.43.109,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "claude-agent-sdk==0.2.163",
    "openai-codex==0.161.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
agentchat = { git = "https://github.com/BerriAI/agentchat.git", rev = "8876e361c4071b4906916452ff3e6c35b1a9c78b" }
