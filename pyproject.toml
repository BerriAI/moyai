[project]
name = "moyai-workspace"
version = "0.1.0"
description = "Moyai on Pydantic AI Harness, Modal, Temporal, and LiteLLM."
requires-python = ">=3.12"
dependencies = ["moyai-pydantic[product]"]

[project.optional-dependencies]
postgres-migration = ["sqlglot>=28,<29"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14", "pyright>=1.1"]

[tool.uv.workspace]
members = ["native"]

[tool.uv.sources]
moyai-pydantic = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["sqlite_only: validates SQLite file or checkpoint behavior"]
