[project]
name = "hermes-workspace"
version = "0.1.0"
description = "An internal agent workspace with Hermes, Modal sandboxes, and native app connections."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "pydantic-settings>=2.8,<3",
  "modal>=1.4,<2",
  "itsdangerous>=2.2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "agentchat",
  "temporalio>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
agentchat = { git = "https://github.com/BerriAI/agentchat.git", rev = "bf38f1044a5feb38d836610cf0fb974f311c0477" }
