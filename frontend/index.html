<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chat with Moyai. Work with your team's context in a cloud workspace.">
  <title>Moyai</title><link rel="icon" href="../app/static/favicon.svg">
  <link rel="preload" href="../app/static/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#03070c">
  <script type="module" src="./main.tsx"></script>
</head>
<body>
  <div id="app" class="contents"></div>
  <dialog id="connection-dialog" data-dialog-scope="settings" aria-labelledby="connection-title"><form id="connection-form"><button class="dialog-close" type="button" aria-label="Close">×</button><h2 id="connection-title">Connect an app</h2><div id="connection-body"></div></form></dialog>
  <dialog id="credential-dialog" aria-labelledby="credential-dialog-title"><form id="credential-form" autocomplete="off"></form></dialog>
  <dialog id="skill-dialog" aria-label="Skill editor"></dialog>
  <dialog id="user-role-dialog" data-dialog-scope="settings" aria-label="Workspace role"></dialog>
  <dialog id="automation-dialog" data-dialog-scope="settings" aria-label="Automation editor"></dialog>
  <dialog id="session-delete-dialog" aria-labelledby="session-delete-title"></dialog>
  <dialog id="session-folder-dialog" aria-labelledby="session-folder-title"></dialog>
  <div id="session-actions" popover="auto" role="group" aria-label="Session actions"></div>
</body>
</html>
